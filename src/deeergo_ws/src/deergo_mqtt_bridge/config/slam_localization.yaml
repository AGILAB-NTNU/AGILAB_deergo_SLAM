slam_toolbox:
  ros__parameters:

    # ============================================================
    # Solver
    # ============================================================

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ============================================================
    # Frames / Topic
    # ============================================================

    use_sim_time: false

    map_frame: map
    odom_frame: odom
    base_frame: base_link

    scan_topic: /scan_sync

    mode: localization

    # ============================================================
    # Serialized map
    #
    # Do NOT add .data / .posegraph extension.
    # ============================================================

    map_file_name: maps/deergo

    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: false

    # ============================================================
    # General
    # ============================================================

    debug_logging: false

    throttle_scans: 1

    # Async mode: keep only newest waiting LaserScan.
    scan_queue_size: 1

    transform_publish_period: 0.05
    transform_timeout: 0.5
    tf_buffer_duration: 30.0

    map_update_interval: 1.0

    # Localization map raster resolution.
    resolution: 0.05

    restamp_tf: false

    min_laser_range: 0.1
    max_laser_range: 50.0

    minimum_time_interval: 0.5

    stack_size_to_use: 40000000

    # ============================================================
    # Scan Matching
    # ============================================================

    use_scan_matching: true
    use_scan_barycenter: true

    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05

    check_min_dist_and_heading_precisely: false

    # Localization scan chain.
    scan_buffer_size: 3
    scan_buffer_maximum_scan_distance: 10.0

    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # ============================================================
    # Loop Closure
    # ============================================================

    do_loop_closing: true

    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    loop_search_maximum_distance: 3.0

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ============================================================
    # Correlation Search
    #
    # Total XY search width:
    #   2.5 m
    #
    # Around odom prediction:
    #   approximately +/-1.25 m
    #
    # Correlation grid resolution:
    #   0.05 m = 5 cm
    #
    # OpenKarto coarse XY step:
    #   approximately 0.10 m
    #
    # Fine refinement:
    #   approximately 0.05 m
    # ============================================================

    correlation_search_space_dimension: 2.5
    correlation_search_space_resolution: 0.05
    correlation_search_space_smear_deviation: 0.10

    # ============================================================
    # Odom / LiDAR Scan Matching Weight
    #
    # Balanced configuration:
    #   LiDAR can correct odometry error,
    #   while large deviations from odom are still penalized.
    # ============================================================

    distance_variance_penalty: 2.0
    angle_variance_penalty: 2.0

    minimum_distance_penalty: 0.85
    minimum_angle_penalty: 0.90

    # ============================================================
    # Angular Search
    #
    # Search range:
    #   +/-90 deg
    #
    # Total:
    #   180 deg
    #
    # Angular resolution:
    #   approximately 2 deg
    # ============================================================

    fine_search_angle_offset: 0.00349

    coarse_search_angle_offset: 1.5708
    coarse_angle_resolution: 0.01745

    use_response_expansion: true

    # ============================================================
    # Occupancy
    # ============================================================

    min_pass_through: 2
    occupancy_threshold: 0.1
